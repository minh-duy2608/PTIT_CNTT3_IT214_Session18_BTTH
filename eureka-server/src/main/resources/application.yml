server:
  port: 8761

spring:
  application:
    name: eureka-server

# Câu 1: Eureka Server là sổ đăng ký trung tâm.
# - Không tự đăng ký chính nó và không cần fetch registry từ server khác.
# - Dashboard xem tại: http://localhost:8761
eureka:
  client:
    register-with-eureka: false
    fetch-registry: false
  server:
    # Tắt self-preservation để dashboard phản hồi nhanh khi ta bật/tắt instance lúc demo
    enable-self-preservation: false
