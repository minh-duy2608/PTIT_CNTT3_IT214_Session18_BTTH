# Cấu hình riêng cho inventory-service (nạp từ Config Server: http://localhost:8888/inventory-service/default)
server:
  port: 8082

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/shopmart_inventory?createDatabaseIfNotExist=true
    username: root
    password: 123456
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    defer-datasource-initialization: true
  sql:
    init:
      mode: always
  kafka:
    consumer:
      properties:
        spring.json.value.default.type: com.shopmart.inventory.event.OrderEvent

  # Câu 4: Distributed Caching với Redis (chiến lược Cache-Aside)
  data:
    redis:
      host: localhost
      port: 6379
  cache:
    type: redis
    redis:
      time-to-live: 60000
      cache-null-values: false

logging:
  level:
    org.springframework.cache: DEBUG
