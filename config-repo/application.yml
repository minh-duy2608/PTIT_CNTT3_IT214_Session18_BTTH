# ======================================================================
# CẤU HÌNH DÙNG CHUNG CHO TẤT CẢ SERVICE (Config Server phân phát)
# ======================================================================
# File này được Config Server trả về cho MỌI client kèm file <application-name>.yml.
# Chỉ nên chứa cấu hình thực sự dùng chung để tránh rò rỉ cấu hình không cần thiết.

# --- Câu 1: Service Discovery (Eureka) ---
eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka
    register-with-eureka: true
    fetch-registry: true

# --- Câu 3: Kafka (event-driven / Saga) ---
spring:
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        # Không gửi kèm type header -> consumer tự cấu hình type (mỗi service có class OrderEvent riêng)
        spring.json.add.type.headers: false
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      auto-offset-reset: earliest
      properties:
        spring.json.trusted.packages: "*"
        spring.json.use.type.headers: false

# --- Câu 2: Actuator (quan sát trạng thái Circuit Breaker) ---
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,circuitbreakers,circuitbreakerevents
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.shopmart: INFO
