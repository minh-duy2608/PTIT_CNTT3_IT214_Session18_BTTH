# Cấu hình riêng cho order-service (nạp từ Config Server: http://localhost:8888/order-service/default)
server:
  port: 8081

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/shopmart_order?createDatabaseIfNotExist=true
    username: root
    password: 123456
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
  kafka:
    consumer:
      properties:
        # Message trên topic "order" được map về class OrderEvent của order-service
        spring.json.value.default.type: com.shopmart.order.event.OrderEvent

# Câu 2: cấu hình Resilience4j cho Circuit Breaker bọc FeignClient inventory-service
resilience4j:
  circuitbreaker:
    instances:
      inventoryService:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
        register-health-indicator: true
